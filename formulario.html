<div>

    <form action="index.html" method="get">
        <div>
            <!--label = me permite ingresar ingresar texto fijo-->
            <label for="nombre"> ingrese nombre </label>
            <!--input caja para ingresar texto-->
            <input type="text" id="nombre">
        </div>
        <div>
            <label for="cedula">Ingrese cedula</label>
            <input type="number" id="cedula">
        </div>

        <div>
            <label for="Edad">Ingrese Edad</label>
            <input type="number" id="Edad">
        </div>
        <div>
            <label for="email">Ingrese correo Electronico</label>
            <input type="email" id="email">
        </div>
        <div>
            <label for="Dirección">Ingrese Dirección</label>
            <input type="text" id="Dirección">
        </div>

        <!--Boton submit me permite enviar la información o petición-->
        <div>
            <input type="submit" value="enviar">
        </div>

    </form>
</div>
